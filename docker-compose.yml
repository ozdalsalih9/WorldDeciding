

services:
  postgres:
    image: postgres:16
    container_name: worlddeciding_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worlddeciding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-worlddeciding}
    ports:
      - "5433:5432"                  # host:5433 → container:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worlddeciding} -d ${POSTGRES_DB:-worlddeciding}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: worlddeciding_redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "20", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data

  # PostgreSQL UI
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: worlddeciding_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    ports:
      - "5050:80"                    # http://localhost:5050
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Redis UI
  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: worlddeciding_redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"                  # http://localhost:5540
    depends_on:
      - redis
    volumes:
      - redisinsight_data:/data

volumes:
  pgdata:
  redis_data:
  pgadmin_data:
  redisinsight_data:
