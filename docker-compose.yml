services:
  postgres:
    image: postgres:16
    container_name: worlddeciding_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worlddeciding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-worlddeciding}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worlddeciding} -d ${POSTGRES_DB:-worlddeciding}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: worlddeciding_redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "20", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: WorldDeciding/Dockerfile
    container_name: worlddeciding_api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      RefreshToken__Pepper: ${REFRESHTOKEN_PEPPER:?Set REFRESHTOKEN_PEPPER in .env}
      Privacy__IpSalt: ${PRIVACY_IPSALT:?Set PRIVACY_IPSALT in .env}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-worlddeciding};Username=${POSTGRES_USER:-worlddeciding};Password=${POSTGRES_PASSWORD}
      Redis__Configuration: redis:6379
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-https://worlddeciding.com}
      Api__BaseUrl: ${API_BASE_URL:-https://worlddeciding.com}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0:-https://worlddeciding.com}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_1:-https://www.worlddeciding.com}
      RefreshCookie__Secure: true
      RefreshCookie__SameSite: None
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: worlddeciding_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-ozdalsalih9@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: worlddeciding_redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    volumes:
      - redisinsight_data:/data

volumes:
  pgdata:
  redis_data:
  pgadmin_data:
  redisinsight_data:
